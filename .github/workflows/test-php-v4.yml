name: Test / PHP [v4]

on:
  pull_request:
    branches:
      - master
      - release/4.0.0
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpcs.xml*'
      - 'phpunit.xml.dist'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Auto per-PR gate: a single WP 7.0 + PHP 8.4 combo. The full WP x PHP
  # matrix (3 combos) is on-demand via test-full-validation-v4.yml.
  php_unit:
    name: PHP Unit 8.4 | WP Version 7.0
    uses: ./.github/workflows/test-php-unit-v4.yml
    with:
      phpVersion: '8.4'
      wpVersion: 'WordPress/WordPress#7.0'
