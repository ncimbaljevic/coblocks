name: Test / E2E Runner

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  chrome_e2e_gamut_tests:
    name: >
      E2E - ${{
        format(
          'WP{0} + PHP{1} + TwentyTwentyFive theme',
          matrix.wp,
          matrix.php
        )
      }}
    uses: ./.github/workflows/test-e2e-cypress.yml
    strategy:
      fail-fast: false
      matrix:
        wp: # Test against the previous and current releases; nightly is covered by test-wp-next.yml.
          - "6.9"
          - "7.0"
        php: # Test against minimum and latest PHP versions.
          - "7.4"
          - "8.4"
    with:
      wpVersion: "WordPress/WordPress#${{matrix.wp}}"
      theme: ""
      phpVersion: ${{matrix.php}}
