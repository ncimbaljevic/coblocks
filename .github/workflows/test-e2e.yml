name: Test / E2E Runner

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  chrome_e2e_gamut_tests:
    name: >
      E2E - ${{
        format(
          'WP{0} + PHP{1} + TwentyTwentyFive theme',
          matrix.wp,
          matrix.php
        )
      }}
    uses: ./.github/workflows/test-e2e-cypress.yml
    strategy:
      fail-fast: false
      # Testing pattern (nightly is covered by test-wp-next.yml against PHP 8.4):
      # - current WP (7.0): every supported PHP (7.4 and 8.4)
      # - previous WP (6.9): lowest supported PHP only (7.4)
      matrix:
        include:
          - wp: "7.0"
            php: "7.4"
          - wp: "7.0"
            php: "8.4"
          - wp: "6.9"
            php: "7.4"
    with:
      wpVersion: "WordPress/WordPress#${{matrix.wp}}"
      theme: ""
      phpVersion: ${{matrix.php}}
