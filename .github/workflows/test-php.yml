name: Test / PHP

on:
  pull_request:
    branches:
      - master

jobs:
  # PHP Unit testing
  # Unit testing runs across the previous and current WP releases; nightly is covered by test-wp-next.yml.
  php_unit_versions_matrix:
    strategy:
      matrix:
        php: ['7.4','8.4']
        wp: ['6.9','7.0']
    name: PHP Unit ${{ matrix.php }} | WP Version ${{ matrix.wp }}
    uses: ./.github/workflows/test-php-unit.yml
    with:
      phpVersion: ${{ matrix.php }}
      wpVersion: 'WordPress/WordPress#${{ matrix.wp }}'

