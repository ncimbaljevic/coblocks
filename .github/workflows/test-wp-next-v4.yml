name: Test / E2E Runner & Jest & PHP Unit runner for WordPress Next version. [v4]

on:
  # On-demand and nightly only — never on every PR.
  workflow_dispatch:
  schedule:
    # Nightly at 02:30 UTC against WP nightly. Remove this block to disable.
    - cron: '30 2 * * *'

# Cancel superseded runs so each new trigger doesn't stack another full nightly
# E2E fan-out on top of the one already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check if WP Next is released
  check_if_released:
    name: Check if WP Next is released
    uses: ./.github/workflows/date-checker.yml
    with:
      # WP Next scheduled release date. Should be based on `https://make.wordpress.org/core/6-4/` or later.
      scheduled_release_date: "2024-04-02"

  # Create WP NEXT Version Constant
  set_constant:
    name: Set WP Next Version Constant
    needs: check_if_released
    if: needs.check_if_released.outputs.should_run_workflow == 'true'
    runs-on: ubuntu-latest
    outputs:
      # Should be current latest WP Next release on `wordpress.org`. eg: `https://wordpress.org/wordpress-7.1-beta2.zip`
      wp_next: "https://wordpress.org/nightly-builds/wordpress-latest.zip"
    steps:
      - run: echo "Setting WP Next Constant"

  # E2E Testing
  chrome_e2e_wp_next:
    name: Chrome E2E WP Next Version
    needs: set_constant
    uses: ./.github/workflows/test-e2e-cypress-v4.yml
    with:
      wpVersion: ${{ needs.set_constant.outputs.wp_next }}
      installPath: "tests-wordpress-nightly"
      theme: ""

  # PHP Unit testing — nightly is tested against the latest supported PHP only.
  php_unit_wp_next:
    needs: set_constant
    name: PHP 8.4 WP Next Version
    uses: ./.github/workflows/test-php-unit-v4.yml
    with:
      phpVersion: '8.4'
      wpVersion: ${{ needs.set_constant.outputs.wp_next }}
