name: Test / E2E Cypress Job [v4]

on:
  workflow_call:
    inputs:
      browser:
        required: false
        type: string
        default: chrome
      theme:
        required: false
        type: string
      wpVersion:
        required: false
        type: string
        default: ""
      phpVersion:
        required: false
        type: string
        default: "8.4"
      installPath:
        required: false
        type: string
        default: "tests-WordPress"
      specFilter:
        required: false
        type: string
        default: ""
    secrets:
      record-key:
        description: 'Record key for Cypress Dashboard'
        required: false

jobs:
  e2e:
    name: E2E Test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup wp-env
        uses: godaddy-wordpress/setup-wp-env@v1
        with:
          core: ${{ inputs.wpVersion }}
          phpVersion: ${{ inputs.phpVersion }}
          plugins: '["."]'
          themes: '[]'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: |
          composer install --prefer-dist --optimize-autoloader &
          yarn install --immutable

      - name: Build plugin
        run: |
          # Build the plugin assets (dist/) with the modern wp-scripts build. The
          # plugin is mounted into wp-env via `plugins: ["."]`, so the freshly
          # built dist/ is picked up live — no legacy grunt build + copy needed
          # (wp-env 11 also removed the `install-path` command that move relied on).
          npm run build

      - name: Prepare tests
        run: |
          WP_CORE_VERSION=$(wp-env run cli wp core version)
          echo "WP_CORE_VERSION=${WP_CORE_VERSION}" >> $GITHUB_ENV
          wp-env run tests-cli wp post generate --count=5
          wp-env run cli wp post generate --count=5
          wp-env run cli wp option update permalink_structure '/%postname%'
          wp-env run tests-cli wp theme activate twentytwentyfive
          # Ensure the plugin (mounted via plugins: ["."]) is active in the tests env.
          wp-env run tests-cli wp plugin activate coblocks

      - name: Run tests
        run: |
          # One wp-env boot + one build, then run the WHOLE selected Cypress spec
          # set in a single `cypress run`. specFilter (a glob) narrows the set;
          # empty runs every spec via the config's specPattern.
          echo '{"wpUsername":"admin","wpPassword":"password","testURL":"http://localhost:9281"}' | jq . > cypress.env.json
          ./node_modules/.bin/cypress verify
          if [ -n "${{ inputs.specFilter }}" ]; then
            ./node_modules/.bin/cypress run --browser ${{ inputs.browser }} --spec "${{ inputs.specFilter }}"
          else
            ./node_modules/.bin/cypress run --browser ${{ inputs.browser }}
          fi

      - name: Upload failure videos
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-wp${{ env.WP_CORE_VERSION }}-php${{ inputs.phpVersion }}
          path: ./.dev/tests/cypress/videos/
          retention-days: 1
